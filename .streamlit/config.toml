[theme]
base = "light"
primaryColor = "#9E1F16"
backgroundColor = "#FFF8E2"
secondaryBackgroundColor = "#F3E2A8"
textColor = "#2B2118"
borderColor = "#D8BF78"
font = "sans-serif"
baseRadius = "0.4rem"

[client]
toolbarMode = "viewer"
# 導覽改放頁面頂端（ui.py 的 top_nav），不用側邊欄
showSidebarNavigation = false

[browser]
gatherUsageStats = false

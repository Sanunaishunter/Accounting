[theme]
base = "light"
primaryColor = "#1E2A38"
backgroundColor = "#FBFCF9"
secondaryBackgroundColor = "#EDF5EF"
textColor = "#1E2A38"
borderColor = "#D6DED8"
font = "sans-serif"
baseRadius = "0.4rem"

[client]
toolbarMode = "viewer"
# 導覽改放頁面頂端（ui.py 的 top_nav），不用側邊欄
showSidebarNavigation = false

[browser]
gatherUsageStats = false
